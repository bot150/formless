<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORMLESS - Authentication</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background-color: #1e293b; padding: 32px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    h1 { margin-top: 0; text-align: center; letter-spacing: 2px; color: #38bdf8; font-size: 26px; }
    p.sub { text-align: center; color: #94a3b8; margin-top: -10px; margin-bottom: 24px; font-size: 14px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
    input[type="email"], input[type="password"] { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; }
    input:focus { outline: none; border-color: #38bdf8; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 11px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-primary:hover { background: #0284c7; color: #fff; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .divider { display: flex; align-items: center; text-align: center; margin: 24px 0; color: #64748b; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }
    .btn-google { width: 100%; background: #ffffff; color: #1e293b; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; font-size: 14px; }
    .btn-google:hover { background: #f1f5f9; }
    .alert { margin-top: 16px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
    .alert-error { background: #450a0a; color: #f87171; border: 1px solid #7f1d1d; }
    .alert-success { background: #064e3b; color: #34d399; border: 1px solid #065f46; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FORMLESS</h1>
    <p class="sub">Intelligent Form Automation</p>

    <div id="alertBox" class="alert"></div>

    <form id="authForm" onsubmit="return false;">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>

      <div class="btn-group">
        <button type="button" class="btn-primary" id="registerBtn" onclick="handleAuth('register')">Register</button>
        <button type="button" class="btn-secondary" id="loginBtn" onclick="handleAuth('login')">Login</button>
      </div>
    </form>

    <div class="divider">OR</div>

    <a href="/api/auth/google/login" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </a>
  </div>

  <script>
    function showAlert(msg, isError = true) {
      const el = document.getElementById("alertBox");
      el.className = isError ? "alert alert-error" : "alert alert-success";
      el.textContent = msg;
      el.style.display = "block";
    }

    async function handleAuth(action) {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        showAlert("Please fill in both email and password.");
        return;
      }

      const endpoint = action === "register" ? "/api/auth/register" : "/api/auth/login";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(data.detail || "Authentication failed.");
          return;
        }

        // Store Formless JWT
        localStorage.setItem("formless_token", data.access_token);
        localStorage.setItem("formless_user", JSON.stringify(data.user));

        showAlert("Authentication successful! Redirecting...", false);
        setTimeout(() => {
          window.location.href = "/profile/setup";
        }, 600);
      } catch (err) {
        showAlert("Network error during " + action);
      }
    }
  </script>
</body>
</html>
